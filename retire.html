  <h1 data-only="continue">은퇴 후에도 국민연금을 계속 낼까?</h1>
  <p class="lead" data-only="continue">은퇴 후 60세까지 임의가입, 60세부터 65세까지 임의계속가입으로 보험료를 계속 내면 연금이 얼마나 회복되는지, 낸 보험료 대비 수익률과 그 돈을 굴렸을 때의 기회비용까지 비교합니다. 모든 금액은 <b>2026년 화폐가치(현재가치)</b> 기준입니다.</p>
  <p class="lead" data-only="quit">납부를 멈추는 나이에 따라 연금이 얼마나 줄어드는지, 임의가입·임의계속가입으로 메우면 얼마나 회복되는지 비교합니다. 모든 금액은 <b>2026년 화폐가치(현재가치)</b> 기준이며, 국민연금은 매년 물가만큼 오릅니다.</p>
